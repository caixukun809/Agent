spring:
  application:
    name: RAG-Login
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./.data/rag_login;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB
server:
  port: ${RAG_LOGIN_PORT:8080}
  error:
    include-message: always
rag:
  api-url: ${RAG_API_URL:http://127.0.0.1:8765}
  internal-key: ${RAG_INTERNAL_API_KEY:local-rag-development-key-change-me}
  document-root: ${RAG_MULTITENANT_DOCUMENT_ROOT:../../Agent/RAG/documents/tenants}
  default-tenant: ${RAG_BOOTSTRAP_TENANT:default}
  auth-secret: ${RAG_AUTH_SECRET:local-only-change-this-secret-to-a-long-random-value}
  token-hours: ${RAG_TOKEN_HOURS:8}
  upload-max-bytes: ${RAG_UPLOAD_MAX_BYTES:104857600}
