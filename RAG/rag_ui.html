<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#236b78">
<title>企业知识助手</title>
<style>
:root{color-scheme:light;--ink:#202b35;--muted:#687782;--line:#dce3e7;--blue:#236b78;--blue-soft:#e8f3f2;--coral:#c7654f;--green:#34785f;--bg:#f2f5f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:14px/1.55 "Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;color:var(--ink)}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.shell{width:min(1440px,100%);margin:0 auto;padding:0 24px}
.appbar{background:#fff;border-bottom:1px solid var(--line)}
.appbar-inner{min-height:74px;display:flex;align-items:center;gap:12px}
.brand-mark{width:34px;height:34px;display:grid;place-items:center;background:#236b78;color:#fff;border-radius:7px;font-size:12px;font-weight:700}
.brand h1{font-size:19px;line-height:1.2;margin:0}
.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}
.service{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#a3adb3}
.dot.ready{background:#37946d}
main.shell{padding-top:18px;padding-bottom:34px}
.system-strip{display:grid;grid-template-columns:90px 100px minmax(110px,.8fr) minmax(145px,1fr) minmax(150px,1fr) minmax(110px,.8fr) auto;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:14px}
.system-item{min-width:0;padding:1px 12px;border-left:1px solid var(--line)}
.system-item:first-child{border-left:0;padding-left:2px}
.system-label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.system-value{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600}
.system-value.status-value{color:var(--green)}
.refresh{border:1px solid var(--line);background:transparent;color:var(--ink);padding:5px 9px;border-radius:6px;font-size:12px}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;align-items:stretch}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;min-width:0}
.panel-head{min-height:50px;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.panel-head h2{font-size:15px;margin:0}
.panel-head .sub{font-size:12px;color:var(--muted)}
.ghost{margin-left:auto;border:1px solid var(--line);background:#fff;color:var(--muted);padding:5px 9px;border-radius:6px;font-size:12px}
.chat-panel{display:flex;flex-direction:column;min-height:575px}
.messages{flex:1;min-height:360px;max-height:560px;overflow:auto;padding:18px 20px}
.welcome{max-width:560px;padding:12px 14px;border-left:3px solid var(--blue);background:#f5f8f8;color:#394951}
.turn{margin:0 0 22px}
.turn-label{font-size:11px;color:var(--muted);margin-bottom:5px}
.message{max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.message.user{margin-left:auto;padding:10px 13px;border-radius:8px 8px 2px 8px;background:var(--blue-soft)}
.message.assistant{padding:2px 0 0 12px;border-left:2px solid #7aa995}
.message.assistant strong{font-weight:700;color:#243d41}
.message.assistant code{font:12px/1.4 Consolas,"Cascadia Code",monospace;background:#edf2f2;border-radius:3px;padding:1px 4px}
.answer-citation{color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.message.loading{color:var(--muted)}
.composer{border-top:1px solid var(--line);padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.composer textarea{min-height:54px;max-height:170px;resize:vertical;border:1px solid var(--line);border-radius:7px;padding:10px 12px;outline:none}
.composer textarea:focus{border-color:#5f9e9d;box-shadow:0 0 0 2px #236b7818}
.compose-actions{display:flex;align-items:center;gap:10px}
.topk-label{font-size:12px;color:var(--muted);white-space:nowrap}
.topk-label input{width:54px;margin-left:4px;padding:6px;border:1px solid var(--line);border-radius:6px}
.send{height:36px;padding:0 15px;border:0;border-radius:6px;background:var(--blue);color:#fff;font-weight:600}
.send:hover{background:#185968}
.trace-panel{min-height:575px}
.trace-list{list-style:none;margin:0;padding:6px 16px 14px}
.step{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:9px;position:relative;padding:12px 0;border-bottom:1px solid #edf0f1}
.step:last-child{border-bottom:0}
.step-index{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#edf3f1;color:var(--green);font-size:11px;font-weight:700}
.step.empty .step-index{background:#fbefe9;color:var(--coral)}
.step-title{font-weight:600;font-size:13px}
.step-detail{display:block;color:var(--muted);font-size:11px;margin-top:2px;overflow-wrap:anywhere}
.step-time{font-size:11px;color:var(--muted);white-space:nowrap}
.trace-empty{padding:18px 16px;color:var(--muted);font-size:12px}
.evidence-panel{margin-top:14px}
.evidence-list{padding:0 16px}
.evidence-empty{padding:22px 0;color:var(--muted)}
.citation{padding:15px 0;border-bottom:1px solid var(--line)}
.citation:last-child{border-bottom:0}
.citation-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.evidence-id{font-size:11px;color:#fff;background:var(--coral);padding:2px 6px;border-radius:4px}
.citation-title{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.relevance{margin-left:auto;color:var(--green);font-size:12px;font-weight:600}
.source-link{display:inline-flex;margin-top:8px;color:var(--blue);text-decoration:underline;text-underline-offset:2px;font-size:12px}
.source-link:hover{color:#184c57}
.quote{margin-top:9px;padding:10px 12px;background:#f6f8f8;border-radius:5px;color:#394951;white-space:pre-wrap;overflow-wrap:anywhere}
.score-details{margin-top:7px}
.score-details summary{cursor:pointer;color:var(--muted);font-size:11px}
.scores{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.score{font-size:11px;color:#52616a;background:#f0f3f4;padding:3px 6px;border-radius:4px}
.source-page{background:#fff;min-height:100vh}
.source-toolbar{position:sticky;top:0;z-index:1;background:#fff;border-bottom:1px solid var(--line);padding:13px max(18px,calc((100% - 1000px)/2))}
.source-toolbar h1{font-size:16px;margin:0}
.source-toolbar p{font-size:12px;color:var(--muted);margin:4px 0 0;overflow-wrap:anywhere}
.source-body{max-width:1000px;margin:0 auto;padding:14px 0 50px;font:12px/1.7 Consolas,"Cascadia Code",monospace}
.source-line{display:grid;grid-template-columns:58px minmax(0,1fr);padding:0 14px}
.source-line .number{color:#93a0a8;text-align:right;padding-right:14px;user-select:none}
.source-line code{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}
.source-line.highlight{background:#fff1d8}
.source-notice{max-width:1000px;margin:18px auto;padding:0 14px;color:var(--muted);font-size:12px}
.error{color:#a33b32}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid #d7e2e3;border-top-color:var(--blue);border-radius:50%;animation:spin .75s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1080px){.system-strip{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:10px}.system-item:nth-child(4){border-left:0;padding-left:2px}}
@media(max-width:820px){.shell{padding-left:14px;padding-right:14px}.workspace{grid-template-columns:minmax(0,1fr)}.chat-panel{min-height:500px}.trace-panel{min-height:0}.messages{max-height:430px}.trace-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px}}
@media(max-width:520px){.appbar-inner{min-height:66px}.brand h1{font-size:17px}.brand p{font-size:11px}.system-strip{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px}.system-item:nth-child(odd){border-left:0;padding-left:2px}.system-item:nth-child(4){border-left:1px solid var(--line);padding-left:12px}.system-item{padding:0 8px}.system-value{font-size:12px}.trace-list{grid-template-columns:1fr;padding-left:12px;padding-right:12px}.messages{padding:14px}.message{max-width:96%}.composer{grid-template-columns:1fr}.compose-actions{justify-content:space-between}.evidence-list{padding:0 12px}.relevance{margin-left:0}.source-toolbar{padding-left:14px;padding-right:14px}.source-body{padding-top:8px}}
</style>
</head>
<body>
<header class="appbar"><div class="shell appbar-inner"><div class="brand-mark">RAG</div><div class="brand"><h1>企业知识助手</h1><p>知识库问答 · 可追溯引用</p></div><div class="service"><span id="serviceDot" class="dot"></span><span id="serviceLabel">连接中</span></div></div></header>
<main class="shell">
  <section class="system-strip" aria-label="知识库状态">
    <div class="system-item"><span class="system-label">服务</span><strong id="healthStatus" class="system-value status-value">读取中</strong></div>
    <div class="system-item"><span class="system-label">索引片段</span><strong id="healthChunks" class="system-value">-</strong></div>
    <div class="system-item"><span class="system-label">Embedding</span><strong id="healthEmbedding" class="system-value" title="">-</strong></div>
    <div class="system-item"><span class="system-label">重排模型</span><strong id="healthReranker" class="system-value" title="">-</strong></div>
    <div class="system-item"><span class="system-label">生成模型</span><strong id="healthGenerator" class="system-value" title="">-</strong></div>
    <div class="system-item"><span class="system-label">引用阈值 · 索引版本</span><strong id="healthIndex" class="system-value">-</strong></div>
    <button class="refresh" type="button" id="refreshHealth">刷新</button>
  </section>
  <div class="workspace">
    <section class="panel chat-panel" aria-label="对话">
      <div class="panel-head"><h2>对话</h2><span id="conversationCount" class="sub">新会话</span><button class="ghost" id="clearChat" type="button">清空</button></div>
      <div id="messages" class="messages"><div class="welcome">你好。请提出问题，我会检索知识库并列出可核查的来源。</div></div>
      <form id="composer" class="composer"><textarea id="question" aria-label="输入问题" placeholder="输入你的问题…" rows="2" required></textarea><div class="compose-actions"><label class="topk-label">引用条数 <input id="topk" type="number" value="5" min="1" max="20"></label><button id="send" class="send" type="submit">发送</button></div></form>
    </section>
    <aside class="panel trace-panel" aria-label="执行链路">
      <div class="panel-head"><h2>执行链路</h2><span class="sub">本轮可观测步骤</span></div>
      <div id="steps"><div class="trace-empty">提交问题后显示召回、重排、阈值校验和生成耗时。</div></div>
    </aside>
  </div>
  <section class="panel evidence-panel" aria-label="检索片段">
    <div class="panel-head"><h2>检索片段</h2><span id="evidenceSummary" class="sub">当前轮次</span></div>
    <div id="evidenceList" class="evidence-list"><div class="evidence-empty">本轮尚无检索结果。</div></div>
  </section>
</main>
<script>
const turns=[];
const $=id=>document.getElementById(id);
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function shortModel(value){const text=String(value||'-').replace(/^local:/,'');return text.split(/[\\/]/).filter(Boolean).pop()||'-'}
function renderHealth(data){
  const ready=data.status==='ready',status=ready?'运行正常':'索引为空';
  $('healthStatus').textContent=status;$('serviceLabel').textContent=status;$('serviceDot').className=`dot ${ready?'ready':''}`;
  $('healthChunks').textContent=Number(data.chunk_count||0).toLocaleString('zh-CN');
  const embedding=data.embedding_model||shortModel(data.embedding);
  const reranker=data.reranker_model||'BGE Reranker Base · 中文';
  const generator=data.generator_model||data.generator||'-';
  $('healthEmbedding').textContent=embedding;$('healthEmbedding').title=data.embedding||embedding;
  $('healthReranker').textContent=reranker;$('healthReranker').title=data.reranker||reranker;
  $('healthGenerator').textContent=generator;$('healthGenerator').title=data.generator||generator;
  $('healthIndex').textContent=`${data.min_evidence_score??'-'} · ${String(data.active_build||'未发布').slice(0,22)}`;
}
async function refreshHealth(){
  try{const response=await fetch('/api/health');if(!response.ok)throw Error(response.statusText);renderHealth(await response.json())}
  catch{$('healthStatus').textContent='连接失败';$('serviceLabel').textContent='连接失败';$('serviceDot').className='dot';$('healthStatus').classList.add('error')}
}
function renderConversation(){
  const box=$('messages');
  if(!turns.length){box.innerHTML='<div class="welcome">你好。请提出问题，我会检索知识库并列出可核查的来源。</div>';$('conversationCount').textContent='新会话';return}
  box.innerHTML=turns.map(turn=>{
    let answer=escapeHtml(turn.answer||'');
    answer=answer.replace(/\[(\d+)\]/g,(marker,number)=>{
      const citation=turn.citations?.[Number(number)-1];if(!citation)return marker;
      const params=new URLSearchParams({path:citation.source,line_start:String(citation.lines[0]),line_end:String(citation.lines[1])});
      return `<a class="answer-citation" href="/source/view?${escapeHtml(params.toString())}" target="_blank" rel="noreferrer" title="打开引用原文">[${number}]</a>`;
    });
    answer=answer.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
    return `<article class="turn"><div class="turn-label">你</div><div class="message user">${escapeHtml(turn.question)}</div><div class="turn-label" style="margin-top:12px">知识助手</div>${turn.pending?'<div class="message assistant loading"><span class="spinner"></span>正在检索并生成回答…</div>':`<div class="message assistant">${answer}</div>`}</article>`;
  }).join('');
  $('conversationCount').textContent=`${turns.length} 轮对话`;box.scrollTop=box.scrollHeight;
}
function renderSteps(steps,loading=false){
  if(loading){$('steps').innerHTML='<div class="trace-empty"><span class="spinner"></span>正在记录本轮执行步骤…</div>';return}
  if(!steps?.length){$('steps').innerHTML='<div class="trace-empty">本轮没有可展示的执行步骤。</div>';return}
  $('steps').innerHTML=`<ol class="trace-list">${steps.map((step,index)=>`<li class="step ${step.status==='empty'?'empty':''}"><span class="step-index">${index+1}</span><div><div class="step-title">${escapeHtml(step.label)}</div><span class="step-detail">${escapeHtml(step.detail)}</span></div><span class="step-time">${Number(step.elapsed_ms).toFixed(1)} ms</span></li>`).join('')}</ol>`;
}
function renderEvidence(items){
  $('evidenceSummary').textContent=items.length?`${items.length} 条通过阈值 · 当前轮次`:'无片段通过引用阈值';
  if(!items.length){$('evidenceList').innerHTML='<div class="evidence-empty">没有达到引用阈值的片段，因此本轮不附知识库引用。</div>';return}
  $('evidenceList').innerHTML=items.map(item=>{
    const filename=String(item.source||'').split(/[\\/]/).pop()||item.title;
    const query=new URLSearchParams({path:item.source,line_start:String(item.lines[0]),line_end:String(item.lines[1])});
    const scores=item.scores||{};
    return `<article class="citation"><div class="citation-head"><span class="evidence-id">${escapeHtml(item.evidence_id)}</span><span class="citation-title">${escapeHtml(item.title)}${item.section?.length?` · ${escapeHtml(item.section.join(' / '))}`:''}</span><span class="relevance">相关度 ${Number(item.score).toFixed(4)}</span></div><a class="source-link" href="/source/view?${escapeHtml(query.toString())}" target="_blank" rel="noreferrer">打开原文 · ${escapeHtml(filename)} · 第 ${item.lines[0]}-${item.lines[1]} 行</a><div class="quote">${escapeHtml(item.quote||'')}</div><details class="score-details"><summary>分数明细</summary><div class="scores">${Object.entries(scores).map(([key,value])=>`<span class="score">${escapeHtml(key)} ${escapeHtml(value)}</span>`).join('')}</div></details></article>`;
  }).join('');
}
async function sendQuestion(event){
  event.preventDefault();const question=$('question').value.trim();if(!question)return;
  const history=turns.filter(turn=>!turn.pending).flatMap(turn=>[{role:'user',content:turn.question},{role:'assistant',content:turn.answer}]).slice(-12);
  const turn={question,pending:true};turns.push(turn);renderConversation();renderSteps([],true);renderEvidence([]);$('send').disabled=true;$('question').value='';
  try{
    const response=await fetch('/api/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,top_k:Number($('topk').value||5),history})});
    const data=await response.json();if(!response.ok)throw Error(data.error||response.statusText);
    turn.answer=data.answer;turn.citations=data.citations||[];turn.pending=false;turn.traceId=data.trace_id;renderConversation();renderSteps(data.pipeline_steps);renderEvidence(turn.citations);
  }catch(error){turn.answer=`请求失败：${error}`;turn.pending=false;renderConversation();renderSteps([]);renderEvidence([])}
  finally{$('send').disabled=false;$('question').focus()}
}
$('composer').addEventListener('submit',sendQuestion);
$('question').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();$('composer').requestSubmit()}});
$('clearChat').addEventListener('click',()=>{turns.length=0;renderConversation();renderSteps([]);renderEvidence([])});
$('refreshHealth').addEventListener('click',refreshHealth);
refreshHealth();
</script>
</body>
</html>
