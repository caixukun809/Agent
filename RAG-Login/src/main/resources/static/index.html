<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163b3a">
<title>企业知识工作台</title>
<style>
:root{color-scheme:light;--ink:#1e2929;--muted:#687878;--line:#dce5e2;--bg:#f3f6f4;--paper:#fff;--teal:#176c62;--teal-soft:#e5f2ef;--orange:#bd633d;--red:#a3433b;--green:#29775e;--yellow:#edd998}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}.hidden{display:none!important}.topbar{height:66px;background:#163b3a;color:#fff;display:flex;align-items:center;padding:0 max(20px,calc((100vw - 1460px)/2));gap:12px}.brand-icon{width:34px;height:34px;border:1px solid #ffffff55;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700}.brand h1{font-size:16px;margin:0}.brand small{display:block;font-size:11px;color:#c1d3cf;margin-top:1px}.top-actions{margin-left:auto;display:flex;align-items:center;gap:12px}.identity{font-size:12px;color:#d6e4e1}.top-button{border:1px solid #ffffff55;color:#fff;background:transparent;padding:6px 10px;border-radius:5px;font-size:12px}.layout{width:min(1460px,100%);margin:auto;padding:20px;display:grid;grid-template-columns:216px minmax(0,1fr);gap:18px;min-height:calc(100vh - 66px)}.sidebar{border-right:1px solid var(--line);padding-right:14px}.side-label{font-size:11px;text-transform:uppercase;color:#889692;padding:12px 10px 7px}.nav{display:grid;gap:3px}.nav button{text-align:left;border:0;background:transparent;border-radius:5px;padding:9px 10px;color:#485755;font-size:13px}.nav button.active,.nav button:hover{background:#e5efec;color:#155e55;font-weight:600}.side-user{margin-top:25px;padding:11px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.content{min-width:0}.page-head{display:flex;align-items:center;gap:12px;margin:2px 0 16px}.page-head h2{font-size:19px;margin:0;font-weight:650}.page-head p{font-size:12px;color:var(--muted);margin:3px 0 0}.page-head .spacer{margin-left:auto}.button{border:1px solid #cbd8d4;background:#fff;color:#31413e;border-radius:5px;padding:7px 11px;font-size:12px}.button.primary{background:var(--teal);border-color:var(--teal);color:white}.button.danger{color:var(--red);border-color:#e4c8c1}.button.small{padding:5px 8px}.grid{display:grid;gap:14px}.grid.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:15px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:7px;min-width:0}.kpi{padding:14px 16px}.kpi-label{font-size:12px;color:var(--muted)}.kpi-value{font-size:25px;font-weight:650;margin-top:6px}.kpi-sub{font-size:11px;color:#7e8b88;margin-top:2px}.panel-head{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line);min-height:46px}.panel-head h3{font-size:14px;margin:0}.panel-head small{color:var(--muted);font-size:11px}.panel-body{padding:14px 15px}.chart{width:100%;height:210px;display:block}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;font-weight:550;color:#6e7c79;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:10px;border-bottom:1px solid #edf1ef;vertical-align:top}tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.tag{display:inline-flex;align-items:center;border-radius:4px;padding:2px 6px;background:#edf2f0;color:#52615e;font-size:10px}.tag.open,.tag.pending{background:#fff3d7;color:#8d641a}.tag.answered,.tag.approved{background:#e6f3ec;color:#28694c}.tag.rejected{background:#faeae6;color:#994b3c}.empty{color:#82908d;padding:25px;text-align:center;font-size:12px}.error{color:var(--red);font-size:12px}.success{color:var(--green);font-size:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{display:grid;gap:5px}.field label{font-size:11px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;border:1px solid #d2ddda;border-radius:5px;padding:8px 9px;outline:none;background:#fff}.field input:focus,.field textarea:focus,.field select:focus{border-color:#4f9589;box-shadow:0 0 0 2px #176c6219}.field textarea{min-height:100px;resize:vertical}.field.full{grid-column:1/-1}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar .spacer{margin-left:auto}.chat-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:stretch}.chat{display:flex;flex-direction:column;min-height:calc(100vh - 145px)}.messages{flex:1;min-height:300px;max-height:calc(100vh - 270px);overflow:auto;padding:18px}.welcome{max-width:560px;padding:12px 14px;border-left:3px solid var(--teal);background:#f4f8f7;color:#465451}.turn{margin-bottom:20px}.turn-label{font-size:10px;color:#899592;margin-bottom:5px}.bubble{max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{margin-left:auto;background:var(--teal-soft);padding:9px 12px;border-radius:7px 7px 2px 7px}.bubble.assistant{padding:2px 0 0 11px;border-left:2px solid #82ad9f}.bubble a{color:var(--teal);font-weight:650}.feedback{display:flex;gap:6px;margin:8px 0 0 12px}.icon-button{border:1px solid #d8e1de;background:white;border-radius:4px;width:30px;height:27px;color:#687774}.icon-button.selected{background:var(--teal-soft);border-color:#94b9ae;color:var(--teal)}.composer{border-top:1px solid var(--line);padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:end}.composer textarea{min-height:52px;max-height:150px;resize:vertical;border:1px solid #d2ddda;border-radius:5px;padding:9px}.compose-right{display:grid;gap:6px;justify-items:end}.compose-right input{width:52px;padding:5px;border:1px solid #d2ddda;border-radius:4px}.trace-list{padding:9px 14px}.trace-step{display:grid;grid-template-columns:20px 1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #eff2f1}.trace-step:last-child{border-bottom:0}.step-no{width:19px;height:19px;border-radius:50%;background:#e8f1ee;color:var(--green);font-size:10px;display:grid;place-items:center}.step-title{font-size:12px;font-weight:600}.step-detail,.step-time{font-size:10px;color:var(--muted)}.step-detail{display:block;overflow-wrap:anywhere}.evidence{margin-top:14px}.citation{padding:12px 0;border-bottom:1px solid #e9eeec}.citation:last-child{border:0}.citation h4{font-size:12px;margin:0}.quote{margin-top:7px;background:#f4f7f6;padding:9px;border-radius:4px;font-size:11px;white-space:pre-wrap}.source-link{color:var(--teal);font-size:11px;text-decoration:underline;cursor:pointer;margin-top:6px;display:inline-block}.citation-score{float:right;color:var(--green);font-size:11px}.login-screen{min-height:100vh;display:grid;grid-template-columns:minmax(260px,1fr) minmax(340px,480px);background:#163b3a}.login-copy{align-self:center;justify-self:center;color:#fff;max-width:520px;padding:40px}.login-copy h1{font-size:34px;margin:0 0 12px}.login-copy p{color:#c7d8d4;max-width:390px;font-size:14px}.login-card{background:#fff;align-self:center;margin:24px;padding:24px;border-radius:8px;box-shadow:0 15px 45px #0e252440}.login-card h2{margin:0 0 5px;font-size:19px}.login-card p{color:var(--muted);font-size:12px;margin:0 0 18px}.login-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}.login-tabs button{border:0;background:none;padding:8px 10px;color:var(--muted);font-size:12px;border-bottom:2px solid transparent}.login-tabs button.active{color:var(--teal);border-color:var(--teal);font-weight:600}.notice{font-size:11px;color:#73827e;margin:9px 0}.toast{position:fixed;right:20px;bottom:20px;max-width:340px;background:#213330;color:#fff;padding:10px 14px;border-radius:5px;font-size:12px;box-shadow:0 5px 20px #14232030;z-index:8}.modal-back{position:fixed;inset:0;background:#10201f75;display:grid;place-items:center;padding:18px;z-index:5}.modal{background:#fff;width:min(840px,100%);max-height:90vh;overflow:auto;border-radius:7px}.source-content{font:12px/1.75 Consolas,"Microsoft YaHei",monospace;white-space:pre-wrap;padding:16px;overflow-wrap:anywhere}.highlight{background:#fff0c4}.status{font-size:11px}.section{margin-bottom:15px}@media(max-width:1100px){.chat-grid{grid-template-columns:minmax(0,1fr)}.trace{order:2}.grid.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.messages{max-height:490px}}@media(max-width:760px){.layout{grid-template-columns:1fr;padding:12px;gap:8px}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:0 0 9px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:7px 9px}.side-label,.side-user{display:none}.topbar{padding:0 13px}.identity{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.login-screen{grid-template-columns:1fr;padding:18px}.login-copy{padding:12px 8px 0;justify-self:start}.login-copy h1{font-size:25px}.login-card{margin:12px 0 25px}.chat{min-height:600px}.messages{max-height:430px}.grid.kpis{gap:8px}.kpi{padding:11px}.kpi-value{font-size:21px}.page-head h2{font-size:17px}}
</style>
</head>
<body>
<section id="authView" class="login-screen">
  <div class="login-copy"><div class="brand-icon">RAG</div><h1>企业知识工作台</h1><p>统一管理知识文档、智能问答、人工服务与运营质量。根据账号角色显示对应工作内容。</p></div>
  <div class="login-card"><h2 id="authTitle">登录工作台</h2><p>使用管理员分配的企业账号访问</p><div class="login-tabs"><button id="loginTab" class="active" type="button">登录</button><button id="bootstrapTab" type="button">首次创建管理员</button></div>
    <form id="loginForm" class="grid">
      <div class="field"><label for="loginUser">账号</label><input id="loginUser" autocomplete="username" required></div>
      <div class="field"><label for="loginPass">密码</label><input id="loginPass" type="password" autocomplete="current-password" required></div>
      <button class="button primary" type="submit">登录</button><div id="loginMessage" class="error"></div>
    </form>
    <form id="bootstrapForm" class="grid hidden">
      <div class="field"><label for="adminName">管理员显示名称</label><input id="adminName" required></div>
      <div class="field"><label for="adminUser">管理员账号</label><input id="adminUser" autocomplete="username" required></div>
      <div class="field"><label for="adminPass">设置密码（至少 12 位）</label><input id="adminPass" type="password" minlength="12" autocomplete="new-password" required></div>
      <button class="button primary" type="submit">创建管理员并登录</button><div id="bootstrapMessage" class="error"></div>
      <div class="notice">首次管理员只允许创建一次。后续账号由管理员在用户管理中创建。</div>
    </form>
  </div>
</section>
<div id="appView" class="hidden">
  <header class="topbar"><div class="brand-icon">RAG</div><div class="brand"><h1>企业知识工作台</h1><small>智能问答 · 文档权限 · 人工服务</small></div><div class="top-actions"><span id="topIdentity" class="identity"></span><button id="changePassword" class="top-button" type="button">修改密码</button><button id="logout" class="top-button" type="button">退出</button></div></header>
  <div class="layout"><aside class="sidebar"><div class="side-label">工作空间</div><nav id="nav" class="nav"></nav><div id="sideUser" class="side-user"></div></aside><main id="main" class="content"></main></div>
</div>
<div id="toast" class="toast hidden"></div><div id="modalRoot"></div>
<script>
const $=id=>document.getElementById(id);const state={token:localStorage.getItem('rag_token')||'',user:null,page:'',turns:[],documents:[],health:null};
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(message){const box=$('toast');box.textContent=message;box.classList.remove('hidden');setTimeout(()=>box.classList.add('hidden'),2800)}
async function api(path,options={}){const headers=new Headers(options.headers||{});if(state.token)headers.set('Authorization',`Bearer ${state.token}`);if(options.body&&!(options.body instanceof FormData))headers.set('Content-Type','application/json');const response=await fetch(path,{...options,headers});let data={};try{data=await response.json()}catch{}if(response.status===401&&state.token){logout();throw Error('登录已失效，请重新登录')}if(!response.ok)throw Error(data.error||data.message||`请求失败 (${response.status})`);return data}
function showAuth(tab='login'){state.token='';state.user=null;$('appView').classList.add('hidden');$('authView').classList.remove('hidden');setAuthTab(tab)}
function setAuthTab(tab){const bootstrap=tab==='bootstrap';$('loginForm').classList.toggle('hidden',bootstrap);$('bootstrapForm').classList.toggle('hidden',!bootstrap);$('loginTab').classList.toggle('active',!bootstrap);$('bootstrapTab').classList.toggle('active',bootstrap);$('authTitle').textContent=bootstrap?'初始化管理员':'登录工作台'}
function logout(){localStorage.removeItem('rag_token');state.token='';state.turns=[];showAuth()}
function userRoleName(role){return ({ADMIN:'管理员',EMPLOYEE:'客服员工',USER:'用户'})[role]||role}
function pagesForRole(role){const common=[['chat','智能问答'],['documents','知识文档'],['tickets','我的客服工单']];if(role==='ADMIN'){const admin=[...common,['dashboard','运营指标'],['users','用户管理'],['reviews','回答审批'],['queue','客服工单']];if(state.user?.platform_admin)admin.push(['tenants','租户管理']);return admin}if(role==='EMPLOYEE')return [...common,['queue','客服工作台']];return common}
async function enterApp(user){state.user=user;$('authView').classList.add('hidden');$('appView').classList.remove('hidden');$('topIdentity').textContent=`${user.display_name} · ${userRoleName(user.role)} · ${user.tenant_id}`;$('sideUser').textContent=`${user.username} / ${userRoleName(user.role)} / ${user.tenant_id}`;renderNav();await navigate('chat')}
function renderNav(){const pages=pagesForRole(state.user.role);$('nav').innerHTML=pages.map(([id,label])=>`<button type="button" data-page="${id}" class="${state.page===id?'active':''}">${label}</button>`).join('');$('nav').querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>navigate(button.dataset.page)))}
async function navigate(page){state.page=page;renderNav();const titles={chat:'智能问答',documents:'知识文档',tickets:'我的客服工单',dashboard:'运营指标',users:'用户管理',reviews:'回答审批',queue:state.user.role==='EMPLOYEE'?'客服工作台':'客服工单',tenants:'租户管理'};$('main').innerHTML=`<div class="page-head"><div><h2>${titles[page]}</h2><p>${page==='chat'?'检索知识并查看可追溯引用':page==='documents'?'管理本租户内可访问的知识文件':'当前租户业务数据'}</p></div></div><div class="empty">正在读取…</div>`;try{if(page==='chat')await renderChat();else if(page==='documents')await renderDocuments();else if(page==='tickets')await renderMyTickets();else if(page==='dashboard')await renderDashboard();else if(page==='users')await renderUsers();else if(page==='reviews')await renderReviews();else if(page==='queue')await renderQueue();else if(page==='tenants')await renderTenants()}catch(error){$('main').innerHTML+=`<div class="error">${esc(error.message)}</div>`}}
function renderChat(){ $('main').innerHTML=`<div class="page-head"><div><h2>智能问答</h2><p>本轮检索过程、引用片段和人工转接状态</p></div><span class="spacer"></span><button class="button" id="clearChat">清空对话</button></div><div class="chat-grid"><section class="panel chat"><div id="messages" class="messages"></div><form id="composer" class="composer"><textarea id="question" aria-label="问题" placeholder="输入问题…" rows="2" required></textarea><div class="compose-right"><label class="muted" style="font-size:10px">引用数 <input id="topk" type="number" min="1" max="20" value="5"></label><button id="send" class="button primary" type="submit">发送</button></div></form></section><aside class="panel trace"><div class="panel-head"><h3>执行链路</h3><small>本轮可观测阶段</small></div><div id="steps" class="trace-list"><div class="empty">发送问题后显示链路步骤</div></div></aside></div><section class="panel evidence"><div class="panel-head"><h3>检索片段</h3><small id="evidenceSummary">当前轮次</small></div><div id="evidenceList" class="panel-body"><div class="empty">本轮暂无检索结果</div></div></section>`;renderTurns();$('composer').addEventListener('submit',sendQuestion);$('question').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit()}});$('clearChat').addEventListener('click',()=>{state.turns=[];renderTurns();$('steps').innerHTML='<div class="empty">发送问题后显示链路步骤</div>';$('evidenceList').innerHTML='<div class="empty">本轮暂无检索结果</div>'})}
function renderTurns(){const box=$('messages');if(!box)return;if(!state.turns.length){box.innerHTML='<div class="welcome">你好。请直接提出问题；没有达到引用阈值时，系统会转给人工客服。</div>';return}box.innerHTML=state.turns.map((turn,index)=>`<article class="turn"><div class="turn-label">你</div><div class="bubble user">${esc(turn.question)}</div><div class="turn-label" style="margin-top:11px">知识助手</div><div class="bubble assistant">${turn.pending?'正在检索并生成回答…':renderAnswer(turn.answer,turn.citations||[])}</div>${turn.pending?'':`<div class="feedback"><button class="icon-button ${turn.vote==='UP'?'selected':''}" title="回答有帮助" data-vote="UP" data-index="${index}">👍</button><button class="icon-button ${turn.vote==='DOWN'?'selected':''}" title="回答需要改进" data-vote="DOWN" data-index="${index}">👎</button>${turn.human_ticket_created?'<span class="status muted">已转人工客服</span>':''}</div>`}</article>`).join('');box.scrollTop=box.scrollHeight;box.querySelectorAll('[data-vote]').forEach(button=>button.addEventListener('click',()=>sendVote(Number(button.dataset.index),button.dataset.vote)))}
function renderAnswer(answer,citations){let html=esc(answer);html=html.replace(/\[(\d+)\]/g,(match,number)=>{const citation=citations[Number(number)-1];return citation?`<a href="#" data-source="${esc(citation.document_id||'')}" data-line-start="${Number(citation.lines?.[0]||1)}" data-line-end="${Number(citation.lines?.[1]||1)}">[${number}]</a>`:match});html=html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>');setTimeout(()=>document.querySelectorAll('[data-source]').forEach(link=>link.addEventListener('click',event=>{event.preventDefault();openSource(link.dataset.source,+link.dataset.lineStart,+link.dataset.lineEnd)})),0);return html}
function renderSteps(steps){$('steps').innerHTML=steps?.length?steps.map((step,i)=>`<div class="trace-step"><span class="step-no">${i+1}</span><div><span class="step-title">${esc(step.label)}</span><span class="step-detail">${esc(step.detail)}</span></div><span class="step-time">${Number(step.elapsed_ms||0).toFixed(1)}ms</span></div>`).join(''):'<div class="empty">没有可展示的执行步骤</div>'}
function renderEvidence(items){$('evidenceSummary').textContent=items.length?`${items.length} 条通过引用阈值`:'没有片段通过引用阈值';$('evidenceList').innerHTML=items.length?items.map((item,index)=>`<article class="citation"><h4><span class="tag">[${index+1}]</span> ${esc(item.title)} <span class="citation-score">相关度 ${Number(item.score).toFixed(3)}</span></h4><a class="source-link" href="#" data-doc="${esc(item.document_id||'')}" data-start="${Number(item.lines?.[0]||1)}" data-end="${Number(item.lines?.[1]||1)}">打开原文 · 第 ${item.lines?.[0]||1}-${item.lines?.[1]||1} 行</a><div class="quote">${esc(item.quote)}</div></article>`).join(''):'<div class="empty">没有达到引用阈值的片段，不会附加知识库引用。</div>';document.querySelectorAll('[data-doc]').forEach(link=>link.addEventListener('click',event=>{event.preventDefault();openSource(link.dataset.doc,+link.dataset.start,+link.dataset.end)}))}
async function sendQuestion(event){event.preventDefault();const question=$('question').value.trim();if(!question)return;const history=state.turns.filter(item=>!item.pending).flatMap(item=>[{role:'user',content:item.question},{role:'assistant',content:item.answer}]).slice(-12);const turn={question,pending:true};state.turns.push(turn);renderTurns();$('steps').innerHTML='<div class="empty">正在执行检索链路…</div>';renderEvidence([]);$('send').disabled=true;$('question').value='';try{const result=await api('/api/chat/query',{method:'POST',body:JSON.stringify({question,top_k:+$('topk').value||5,history})});Object.assign(turn,{pending:false,answer:result.answer,citations:result.citations||[],traceId:result.trace_id,human_ticket_created:result.human_ticket_created});renderTurns();renderSteps(result.pipeline_steps);renderEvidence(turn.citations)}catch(error){turn.pending=false;turn.answer=`请求失败：${error.message}`;renderTurns();renderSteps([]);renderEvidence([])}finally{$('send').disabled=false;$('question').focus()}}
async function sendVote(index,vote){const turn=state.turns[index];if(turn.vote){toast('本轮回答已提交评价');return}try{const result=await api('/api/feedback',{method:'POST',body:JSON.stringify({traceId:turn.traceId,question:turn.question,answer:turn.answer,vote})});turn.vote=vote;renderTurns();toast(vote==='DOWN'&&result.status==='PENDING'?'已提交反馈，等待管理员审核':'感谢反馈')}catch(error){toast(error.message)}}
async function openSource(id,start,end){if(!id){toast('找不到来源文档');return}try{const data=await api(`/api/documents/${encodeURIComponent(id)}/preview?lineStart=${start}&lineEnd=${end}`);const lines=String(data.content||'').split(/\r?\n/);const first=Math.max(1,start-40),last=Math.min(lines.length,end+40);const body=lines.slice(first-1,last).map((line,index)=>{const number=first+index,active=number>=start&&number<=end;return `<div class="${active?'highlight':''}" id="src-${number}"><span class="muted">${String(number).padStart(4,' ')}</span>  ${esc(line)||' '}</div>`}).join('');$('modalRoot').innerHTML=`<div class="modal-back" id="modalBack"><div class="modal"><div class="panel-head"><h3>${esc(data.title)}</h3><span class="spacer"></span><button class="button small" id="closeModal">关闭</button></div><div class="panel-body muted">引用原文 · 第 ${start}-${end} 行 · 共 ${data.line_count} 行</div><div class="source-content">${body}</div></div></div>`;$('closeModal').onclick=()=>$('modalRoot').innerHTML='';$('modalBack').addEventListener('click',event=>{if(event.target.id==='modalBack')$('modalRoot').innerHTML=''})}catch(error){toast(error.message)}}
async function renderDocuments(){const docs=await api('/api/documents');state.documents=docs;$('main').innerHTML=`<div class="page-head"><div><h2>知识文档</h2><p>文件按租户隔离，并按公共、指定用户或私人范围授权</p></div></div><section class="panel section"><div class="panel-head"><h3>导入文件</h3><small>支持 PDF、DOCX、PPTX、XLSX、Markdown、TXT、HTML、JSON</small></div><div class="panel-body"><form id="uploadForm" class="form-grid"><div class="field"><label>选择文件</label><input id="uploadFile" name="file" type="file" required></div><div class="field"><label>可见范围</label><select id="visibility"><option value="PRIVATE">仅上传者与管理员</option><option value="SELECTED_USERS">指定用户</option>${state.user.role!=='USER'?'<option value="TENANT_PUBLIC">本租户公共</option>':''}</select></div><div class="field full" id="grantField"><label>指定用户 ID（逗号分隔）</label><input id="grantedIds" placeholder="例如 3, 5"></div><div class="field full"><button class="button primary">上传并建立索引</button><span id="uploadMessage" class="status"></span></div></form></div></section><section class="panel"><div class="panel-head"><h3>可访问文档</h3><span class="spacer"></span>${state.user.role==='ADMIN'?'<button class="button small" id="reindex">重建当前租户索引</button>':''}</div><div id="docTable" class="table-wrap">${docs.length?`<table><thead><tr><th>文件</th><th>权限</th><th>索引</th><th>上传时间</th></tr></thead><tbody>${docs.map(doc=>`<tr><td>${esc(doc.name)}</td><td>${visibilityName(doc.visibility)}</td><td><span class="tag">${esc(doc.status)}</span></td><td>${new Date(doc.created_at).toLocaleString('zh-CN')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">当前没有可访问文档</div>'}</div></section>`;$('visibility').addEventListener('change',()=>$('grantField').classList.toggle('hidden',$('visibility').value!=='SELECTED_USERS'));$('uploadForm').addEventListener('submit',uploadDocument);const reindex=$('reindex');if(reindex)reindex.onclick=async()=>{reindex.disabled=true;try{await api('/api/admin/reindex',{method:'POST'});toast('当前租户索引已更新');await renderDocuments()}catch(error){toast(error.message)}finally{reindex.disabled=false}}}
function visibilityName(value){return ({TENANT_PUBLIC:'本租户公共',SELECTED_USERS:'指定用户',PRIVATE:'私人'})[value]||value}
async function uploadDocument(event){event.preventDefault();const file=$('uploadFile').files[0];const data=new FormData();data.append('file',file);data.append('visibility',$('visibility').value);data.append('grantedUserIds',$('grantedIds').value);$('uploadMessage').textContent='上传中…';try{const result=await api('/api/documents',{method:'POST',body:data});$('uploadMessage').className='status success';$('uploadMessage').textContent=result.message;toast(result.message);setTimeout(renderDocuments,800)}catch(error){$('uploadMessage').className='status error';$('uploadMessage').textContent=error.message}}
async function renderMyTickets(){const items=await api('/api/support/mine');$('main').innerHTML=`<div class="page-head"><div><h2>我的客服工单</h2><p>知识库缺少可引用依据时自动创建转人工请求</p></div></div><section class="panel">${items.length?`<div class="table-wrap"><table><thead><tr><th>问题</th><th>状态</th><th>创建时间</th><th>客服答复</th><th></th></tr></thead><tbody>${items.map(item=>`<tr><td>${esc(item.question)}</td><td><span class="tag ${item.status.toLowerCase()}">${ticketStatus(item.status)}</span></td><td>${new Date(item.createdAt).toLocaleString('zh-CN')}</td><td>${esc(item.employeeAnswer||'等待客服回复')}</td><td>${item.status==='ANSWERED'?`<button class="button small" data-close="${item.id}">关闭工单</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">当前没有客服工单</div>'}</section>`;document.querySelectorAll('[data-close]').forEach(button=>button.onclick=async()=>{await api(`/api/support/${button.dataset.close}/close`,{method:'PATCH'});toast('工单已关闭');renderMyTickets()})}
function ticketStatus(value){return ({OPEN:'待处理',ANSWERED:'已答复',CLOSED:'已关闭'})[value]||value}
async function renderQueue(){const items=await api('/api/support/queue');$('main').innerHTML=`<div class="page-head"><div><h2>客服工作台</h2><p>处理当前租户中等待人工答复的问题</p></div><span class="spacer"></span><button id="refreshQueue" class="button">刷新</button></div><div class="grid">${items.length?items.map(item=>`<section class="panel"><div class="panel-head"><h3>工单 #${item.id}</h3><span class="tag open">待处理</span><span class="spacer"></span><small>${new Date(item.createdAt).toLocaleString('zh-CN')}</small></div><div class="panel-body"><div class="muted" style="font-size:11px">用户问题</div><p>${esc(item.question)}</p>${item.suggestedAnswer?`<details><summary class="muted" style="font-size:11px;cursor:pointer">模型尝试回答</summary><p>${esc(item.suggestedAnswer)}</p></details>`:''}<form data-answer-form="${item.id}" class="grid"><div class="field"><label>客服答复</label><textarea name="answer" required></textarea></div><button class="button primary" style="justify-self:start">提交答复</button></form></div></section>`).join(''):'<section class="panel empty">当前没有待处理工单</section>'}</div>`;$('refreshQueue').onclick=renderQueue;document.querySelectorAll('[data-answer-form]').forEach(form=>form.addEventListener('submit',async event=>{event.preventDefault();const id=form.dataset.answerForm,answer=new FormData(form).get('answer');try{await api(`/api/support/${id}/answer`,{method:'PATCH',body:JSON.stringify({answer})});toast('客服答复已提交');renderQueue()}catch(error){toast(error.message)}}))}
async function renderReviews(){const items=await api('/api/feedback/pending');$('main').innerHTML=`<div class="page-head"><div><h2>回答审批</h2><p>复核用户点踩的模型回答</p></div></div><div class="grid">${items.length?items.map(item=>`<section class="panel"><div class="panel-head"><h3>反馈 #${item.id}</h3><span class="tag pending">待审核</span><span class="spacer"></span><small>${new Date(item.createdAt).toLocaleString('zh-CN')}</small></div><div class="panel-body"><div class="muted" style="font-size:11px">用户问题</div><p>${esc(item.question)}</p><div class="muted" style="font-size:11px">模型回答</div><p>${esc(item.answer)}</p><form data-review="${item.id}" class="toolbar"><input name="note" class="button" placeholder="审核备注" style="flex:1;min-width:150px"><button class="button primary" name="decision" value="APPROVED">审核通过</button><button class="button danger" name="decision" value="REJECTED">驳回</button></form></div></section>`).join(''):'<section class="panel empty">没有待审批的点踩回答</section>'}</div>`;document.querySelectorAll('[data-review]').forEach(form=>form.addEventListener('submit',async event=>{event.preventDefault();const submitter=event.submitter;try{await api(`/api/feedback/${form.dataset.review}`,{method:'PATCH',body:JSON.stringify({status:submitter.value,note:new FormData(form).get('note')})});toast('审核已保存');renderReviews()}catch(error){toast(error.message)}}))}
async function renderUsers(){const users=await api('/api/admin/users');$('main').innerHTML=`<div class="page-head"><div><h2>用户管理</h2><p>用户、管理员和客服员工使用独立角色权限；指定文档权限时可使用账号 ID</p></div></div><section class="panel section"><div class="panel-head"><h3>创建账号</h3></div><div class="panel-body"><form id="userForm" class="form-grid"><div class="field"><label>账号</label><input name="username" required></div><div class="field"><label>显示名称</label><input name="displayName" required></div><div class="field"><label>初始密码（至少 12 位）</label><input name="password" type="password" minlength="12" required></div><div class="field"><label>角色</label><select name="role"><option value="USER">用户</option><option value="EMPLOYEE">客服员工</option><option value="ADMIN">管理员</option></select></div><div class="field full"><button class="button primary">创建账号</button></div></form></div></section><section class="panel"><div class="panel-head"><h3>本租户账号</h3></div><div class="table-wrap">${users.length?`<table><thead><tr><th>ID</th><th>账号</th><th>显示名</th><th>角色</th><th>状态</th></tr></thead><tbody>${users.map(user=>`<tr><td>${user.id}</td><td>${esc(user.username)}</td><td>${esc(user.display_name)}</td><td>${userRoleName(user.role)}</td><td>${user.enabled?'启用':'停用'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无账号</div>'}</div></section>`;$('userForm').addEventListener('submit',async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.currentTarget));try{await api('/api/admin/users',{method:'POST',body:JSON.stringify(data)});toast('账号已创建');renderUsers()}catch(error){toast(error.message)}})}
async function renderTenants(){const items=await api('/api/admin/tenants');$('main').innerHTML=`<div class="page-head"><div><h2>租户管理</h2><p>为新企业创建独立租户和首个管理员账号</p></div></div><section class="panel section"><div class="panel-head"><h3>开通租户</h3></div><div class="panel-body"><form id="tenantForm" class="form-grid"><div class="field"><label>租户标识</label><input name="tenantId" pattern="[A-Za-z0-9_-]{2,64}" required placeholder="例如 acme"></div><div class="field"><label>企业名称</label><input name="displayName" required></div><div class="field"><label>管理员账号</label><input name="adminUsername" required></div><div class="field"><label>管理员显示名称</label><input name="adminDisplayName" required></div><div class="field"><label>管理员初始密码（至少 12 位）</label><input name="adminPassword" type="password" minlength="12" required></div><div class="field full"><button class="button primary">创建租户</button></div></form></div></section><section class="panel"><div class="panel-head"><h3>已开通租户</h3></div><div class="table-wrap">${items.length?`<table><thead><tr><th>标识</th><th>企业</th><th>开通时间</th></tr></thead><tbody>${items.map(item=>`<tr><td>${esc(item.id)}</td><td>${esc(item.name)}</td><td>${new Date(item.created_at).toLocaleString('zh-CN')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无租户</div>'}</div></section>`;$('tenantForm').addEventListener('submit',async event=>{event.preventDefault();const form=Object.fromEntries(new FormData(event.currentTarget));try{await api('/api/admin/tenants',{method:'POST',body:JSON.stringify(form)});toast('新租户已开通');renderTenants()}catch(error){toast(error.message)}})}
async function renderDashboard(){const data=await api('/api/admin/metrics');state.health=data.rag_health;$('main').innerHTML=`<div class="page-head"><div><h2>运营指标</h2><p>仅统计当前租户的问答、反馈和人工客服数据</p></div><span class="spacer"></span><span class="tag">RAG ${esc(data.rag_health?.status||'unknown')}</span><button id="refreshMetrics" class="button">刷新</button></div><div class="grid kpis"><section class="panel kpi"><div class="kpi-label">问答总量</div><div class="kpi-value">${Number(data.queries).toLocaleString()}</div><div class="kpi-sub">当前租户累计请求</div></section><section class="panel kpi"><div class="kpi-label">检索命中</div><div class="kpi-value">${Number(data.with_evidence).toLocaleString()}</div><div class="kpi-sub">有达到阈值的引用</div></section><section class="panel kpi"><div class="kpi-label">待人工工单</div><div class="kpi-value">${Number(data.open_tickets).toLocaleString()}</div><div class="kpi-sub">等待客服员工处理</div></section><section class="panel kpi"><div class="kpi-label">待审批点踩</div><div class="kpi-value">${Number(data.pending_feedback).toLocaleString()}</div><div class="kpi-sub">需管理员复核</div></section></div><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><section class="panel"><div class="panel-head"><h3>问答检索情况</h3></div><div class="panel-body"><canvas id="retrievalChart" class="chart" aria-label="问答检索情况图表"></canvas></div></section><section class="panel"><div class="panel-head"><h3>回答反馈</h3></div><div class="panel-body"><canvas id="feedbackChart" class="chart" aria-label="回答反馈图表"></canvas></div></section></div><div class="grid kpis" style="margin-top:14px"><section class="panel kpi"><div class="kpi-label">无证据回答</div><div class="kpi-value">${Number(data.without_evidence).toLocaleString()}</div></section><section class="panel kpi"><div class="kpi-label">点赞</div><div class="kpi-value">${Number(data.positive_feedback).toLocaleString()}</div></section><section class="panel kpi"><div class="kpi-label">点踩</div><div class="kpi-value">${Number(data.negative_feedback).toLocaleString()}</div></section><section class="panel kpi"><div class="kpi-label">知识文档</div><div class="kpi-value">${Number(data.documents).toLocaleString()}</div></section></div>`;drawDonut('retrievalChart',[['检索命中',data.with_evidence,'#29775e'],['无有效引用',data.without_evidence,'#bd633d']]);drawDonut('feedbackChart',[['点赞',data.positive_feedback,'#176c62'],['点踩',data.negative_feedback,'#bd633d']]);$('refreshMetrics').onclick=renderDashboard}
function drawDonut(id,items){const canvas=$(id);const rect=canvas.getBoundingClientRect(),scale=window.devicePixelRatio||1;canvas.width=rect.width*scale;canvas.height=rect.height*scale;const ctx=canvas.getContext('2d');ctx.scale(scale,scale);const w=rect.width,h=rect.height,cx=w*.42,cy=h*.5,r=Math.min(76,h*.35),total=items.reduce((n,item)=>n+Number(item[1]),0);ctx.lineWidth=21;ctx.lineCap='butt';let angle=-Math.PI/2;if(!total){ctx.strokeStyle='#e7ecea';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke()}else for(const [label,value,color] of items){const amount=Number(value);const sweep=amount/total*Math.PI*2;ctx.strokeStyle=color;ctx.beginPath();ctx.arc(cx,cy,r,angle,angle+sweep-.025);ctx.stroke();angle+=sweep}ctx.fillStyle='#1e2929';ctx.font='600 20px Segoe UI';ctx.textAlign='center';ctx.fillText(String(total),cx,cy+6);ctx.fillStyle='#687878';ctx.font='11px Segoe UI';ctx.fillText('总量',cx,cy+23);ctx.textAlign='left';items.forEach((item,index)=>{const y=cy-20+index*27;ctx.fillStyle=item[2];ctx.fillRect(w*.73,y-8,9,9);ctx.fillStyle='#52615e';ctx.font='12px Segoe UI';ctx.fillText(`${item[0]}  ${item[1]}`,w*.73+16,y)})}
function openPasswordDialog(){$('modalRoot').innerHTML=`<div class="modal-back" id="passwordBack"><section class="modal" style="max-width:440px"><div class="panel-head"><h3>修改登录密码</h3><span class="spacer"></span><button id="passwordClose" class="button small" type="button">关闭</button></div><form id="passwordForm" class="panel-body grid"><div class="field"><label>当前密码</label><input name="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label>新密码（至少 12 位）</label><input name="newPassword" type="password" minlength="12" autocomplete="new-password" required></div><div id="passwordMessage" class="error"></div><button class="button primary" type="submit">保存新密码</button></form></section></div>`;$('passwordClose').onclick=()=>$('modalRoot').innerHTML='';$('passwordBack').addEventListener('click',event=>{if(event.target.id==='passwordBack')$('modalRoot').innerHTML=''});$('passwordForm').addEventListener('submit',async event=>{event.preventDefault();const form=Object.fromEntries(new FormData(event.currentTarget));try{await api('/api/auth/password',{method:'POST',body:JSON.stringify(form)});$('modalRoot').innerHTML='';toast('密码已更新')}catch(error){$('passwordMessage').textContent=error.message}})}
async function start(){ $('loginTab').onclick=()=>setAuthTab('login');$('bootstrapTab').onclick=()=>setAuthTab('bootstrap');$('loginForm').addEventListener('submit',async event=>{event.preventDefault();$('loginMessage').textContent='';try{const result=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})});state.token=result.token;localStorage.setItem('rag_token',state.token);await enterApp(result.user)}catch(error){$('loginMessage').textContent=error.message}});$('bootstrapForm').addEventListener('submit',async event=>{event.preventDefault();$('bootstrapMessage').textContent='';try{const result=await api('/api/auth/bootstrap',{method:'POST',body:JSON.stringify({displayName:$('adminName').value,username:$('adminUser').value,password:$('adminPass').value})});state.token=result.token;localStorage.setItem('rag_token',state.token);await enterApp(result.user)}catch(error){$('bootstrapMessage').textContent=error.message}});$('logout').onclick=logout;$('changePassword').onclick=openPasswordDialog;if(state.token){try{const user=await api('/api/auth/me');await enterApp(user)}catch{logout()}}}
start();
</script>
